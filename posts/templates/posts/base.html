{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Glacirey — Blog{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'posts/css/style.css' %}">
</head>
<body>
  <!-- Lapisan latar parallax -->
  <div class="bg-scene" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="shard shard-1"></div>
    <div class="shard shard-2"></div>
    <div class="shard shard-3"></div>
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
  </div>

  <div class="noise" aria-hidden="true"></div>

  <header class="nav">
    <a href="{% url 'post_list' %}" class="brand">
      <span class="brand-cube" aria-hidden="true">
        <span class="face f-front"></span>
        <span class="face f-back"></span>
        <span class="face f-left"></span>
        <span class="face f-right"></span>
        <span class="face f-top"></span>
        <span class="face f-bottom"></span>
      </span>
      GLACI<span class="brand-rey">REY</span><span class="brand-dot">.</span>
    </a>

    <div class="nav-search">
      <input type="text" id="live-search" placeholder="Cari artikel…" autocomplete="off" aria-label="Cari artikel">
      <div id="search-results" class="search-results" hidden></div>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p>Glacirey — blog bergaya semi-3D · Project 5 by Rey</p>
  </footer>

  <script src="{% static 'posts/js/main.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
